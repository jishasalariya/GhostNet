[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "ghostnet"
version = "2.0.0"
description = "GhostNet website security analysis service"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.141,<1",
  "uvicorn[standard]>=0.35,<1",
  "supabase>=2.18,<3",
  "google-genai>=1.38,<3",
  "pydantic>=2.13,<3",
  "httpx>=0.28,<1",
  "python-dotenv>=1.1,<2",
  "tldextract>=5.3,<6"
]

[project.optional-dependencies]
dev = [
  "pytest>=8.4,<9",
  "pytest-asyncio>=1.1,<2",
  "ruff>=0.12,<1"
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["backend"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.setuptools]
py-modules = []
