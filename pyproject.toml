[project]
name = "ghostnet"
version = "1.0.0"
description = "Web security analysis tool with AI-assisted risk assessment."
requires-python = ">=3.10"
dependencies = [
    "fastapi==0.111.0",
    "uvicorn==0.30.1",
    "supabase==2.5.1",
    "google-generativeai==0.7.2",
    "pydantic==2.7.4",
    "httpx==0.27.0",
    "python-dotenv==1.0.1",
    "tldextract==5.1.2"
]

[tool.fastapi]
entrypoint = "backend.main:app"

[tool.vercel]
entrypoint = "backend.main:app"
